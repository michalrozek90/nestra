name: Desktop release assets

on:
  release:
    types:
      - created
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing draft or published release tag that should receive the Windows installer (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-assets-${{ github.event.release.tag_name || inputs.tag_name }}
  cancel-in-progress: true

jobs:
  attach-windows-installer:
    name: Attach Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CI: true
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.13.1

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 1.97.1 patch
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-targets: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify product version synchronization
        run: pnpm check:product-version

      - name: Prepare desktop production environment file
        shell: pwsh
        run: |
          Copy-Item apps/client/.env.desktop.example apps/client/.env.desktop

      - name: Build Windows x64 NSIS installer
        run: pnpm build:desktop

      - name: Resolve installer artifact path
        id: installer
        run: node ./apps/desktop/scripts/installer-artifact.mjs

      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        shell: pwsh
        run: |
          gh release upload "$env:RELEASE_TAG" "$env:INSTALLER_PATH" --clobber
