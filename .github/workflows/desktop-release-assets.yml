name: Desktop release assets

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing draft release tag name that should receive the Windows installer (for example v0.2.0)
        required: true
        type: string
      release_sha:
        description: Exact release commit from Release Please; resolved from the draft when omitted for a manual run
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-assets-${{ inputs.tag_name }}
  cancel-in-progress: true

jobs:
  attach-windows-installer:
    name: Attach Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CI: true
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      RELEASE_TAG: ${{ inputs.tag_name }}
      REQUESTED_RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Resolve draft release candidate
        id: resolve-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            Write-Error "RELEASE_TAG must identify an existing draft GitHub Release."
            exit 1
          }

          $releasePages = gh api `
            --paginate `
            --slurp `
            "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          $releases = @($releasePages | ForEach-Object { $_ })
          $matchingReleases = @($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG })

          if ($matchingReleases.Count -ne 1) {
            Write-Error "Expected exactly one release named $env:RELEASE_TAG, found $($matchingReleases.Count)."
            exit 1
          }

          $release = $matchingReleases[0]
          if (-not $release.draft -or $release.prerelease) {
            Write-Error "Desktop update assets can only be attached to a non-prerelease draft."
            exit 1
          }

          $draftReleaseSha = [string]$release.target_commitish
          $requestedReleaseSha = [string]$env:REQUESTED_RELEASE_SHA
          if (
            -not [string]::IsNullOrWhiteSpace($requestedReleaseSha) -and
            $requestedReleaseSha -ne $draftReleaseSha
          ) {
            Write-Error "Release Please SHA does not match the draft release target commit."
            exit 1
          }

          if ($draftReleaseSha -notmatch '^[0-9a-fA-F]{40}$') {
            Write-Error "Draft release target_commitish must be an exact 40-character commit SHA."
            exit 1
          }

          "release_id=$($release.id)" >> $env:GITHUB_OUTPUT
          "release_sha=$($draftReleaseSha.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.resolve-release.outputs.release_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.13.1

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 1.97.1 patch
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-targets: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify product version synchronization
        run: pnpm check:product-version

      - name: Validate checked-out release candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.resolve-release.outputs.release_id }}
          RELEASE_SHA: ${{ steps.resolve-release.outputs.release_sha }}
        shell: pwsh
        run: |
          $productVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$productVersion"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            Write-Error "Release tag must match the product version ($expectedTag)."
            exit 1
          }

          $checkedOutSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($checkedOutSha -ne $env:RELEASE_SHA) {
            Write-Error "Checked-out commit does not match the resolved draft release commit."
            exit 1
          }

          $release = gh api "repos/${{ github.repository }}/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if (-not $release.draft -or $release.prerelease) {
            Write-Error "Desktop update assets can only be attached to a non-prerelease draft."
            exit 1
          }
          if ($release.tag_name -ne $env:RELEASE_TAG) {
            Write-Error "Draft release tag name changed after resolution."
            exit 1
          }
          if ([string]$release.target_commitish -ne $env:RELEASE_SHA) {
            Write-Error "Draft release target commit changed after checkout."
            exit 1
          }

      - name: Prepare desktop production environment file
        shell: pwsh
        run: |
          Copy-Item apps/client/.env.desktop.example apps/client/.env.desktop

      - name: Build and attach signed Windows updater assets
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ steps.resolve-release.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseDraft: true
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.release.conf.json --target x86_64-pc-windows-msvc -- --locked
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

      - name: Validate attached updater assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.resolve-release.outputs.release_id }}
          RELEASE_SHA: ${{ steps.resolve-release.outputs.release_sha }}
        shell: pwsh
        run: |
          $productVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installerName = "Nestra_${productVersion}_x64-setup.exe"
          $requiredAssets = @($installerName, "$installerName.sig", "latest.json")
          $release = gh api "repos/${{ github.repository }}/releases/$env:RELEASE_ID" | ConvertFrom-Json

          if (-not $release.draft -or $release.prerelease) {
            Write-Error "The release changed state while updater assets were being built."
            exit 1
          }
          if (
            $release.tag_name -ne $env:RELEASE_TAG -or
            [string]$release.target_commitish -ne $env:RELEASE_SHA
          ) {
            Write-Error "The release identity or target commit changed while assets were being built."
            exit 1
          }
          $releaseAssetsByName = @{}
          foreach ($assetName in $requiredAssets) {
            $matchingAssets = @($release.assets | Where-Object { $_.name -eq $assetName })
            if ($matchingAssets.Count -ne 1) {
              Write-Error "Expected exactly one updater asset named ${assetName}, found $($matchingAssets.Count)."
              exit 1
            }
            $releaseAssetsByName[$assetName] = $matchingAssets[0]
          }

          $validationDirectory = Join-Path $env:RUNNER_TEMP "nestra-updater-validation"
          New-Item -ItemType Directory -Path $validationDirectory -Force | Out-Null
          gh release download "$env:RELEASE_TAG" --pattern "latest.json" --dir $validationDirectory --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Could not download latest.json from the draft release."
            exit 1
          }

          $manifest = Get-Content (Join-Path $validationDirectory "latest.json") -Raw | ConvertFrom-Json
          if ([string]$manifest.version -ne $productVersion) {
            Write-Error "Updater manifest version does not match the root product version."
            exit 1
          }

          $windowsX64 = $manifest.platforms.'windows-x86_64'
          $windowsX64Nsis = $manifest.platforms.'windows-x86_64-nsis'
          if ($null -eq $windowsX64 -or $null -eq $windowsX64Nsis) {
            Write-Error "Updater manifest is missing a Windows x64 NSIS platform entry."
            exit 1
          }

          $installerAssetUrl = [string]$releaseAssetsByName[$installerName].url
          if (
            [string]$windowsX64.url -ne $installerAssetUrl -or
            [string]$windowsX64Nsis.url -ne $installerAssetUrl
          ) {
            Write-Error "Windows x64 updater URL does not match the release installer asset."
            exit 1
          }

          $windowsX64Signature = [string]$windowsX64.signature
          if ([string]::IsNullOrWhiteSpace($windowsX64Signature)) {
            Write-Error "Windows x64 updater signature is missing."
            exit 1
          }
          if ([string]$windowsX64Nsis.signature -ne $windowsX64Signature) {
            Write-Error "Windows x64 NSIS updater signature does not match the primary entry."
            exit 1
          }
