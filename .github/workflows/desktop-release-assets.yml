name: Desktop release assets

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing draft or published release tag that should receive the Windows installer (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-assets-${{ inputs.tag_name }}
  cancel-in-progress: true

jobs:
  attach-windows-installer:
    name: Attach Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CI: true
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      RELEASE_TAG: ${{ inputs.tag_name }}
    steps:
      - name: Require release tag
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            Write-Error "RELEASE_TAG must be set to an existing GitHub Release tag."
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.13.1

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 1.97.1 patch
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-targets: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify product version synchronization
        run: pnpm check:product-version

      - name: Validate draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $productVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$productVersion"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            Write-Error "Release tag must match the product version ($expectedTag)."
            exit 1
          }

          $release = gh api "repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if (-not $release.draft -or $release.prerelease) {
            Write-Error "Desktop update assets can only be attached to a non-prerelease draft."
            exit 1
          }
          "release_id=$($release.id)" >> $env:GITHUB_OUTPUT

      - name: Prepare desktop production environment file
        shell: pwsh
        run: |
          Copy-Item apps/client/.env.desktop.example apps/client/.env.desktop

      - name: Build and attach signed Windows updater assets
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ steps.release.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseDraft: true
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.release.conf.json --target x86_64-pc-windows-msvc
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

      - name: Validate attached updater assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $productVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installerName = "Nestra_${productVersion}_x64-setup.exe"
          $requiredAssets = @($installerName, "$installerName.sig", "latest.json")
          $release = gh api "repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json

          if (-not $release.draft -or $release.prerelease) {
            Write-Error "The release changed state while updater assets were being built."
            exit 1
          }
          foreach ($assetName in $requiredAssets) {
            if ($release.assets.name -notcontains $assetName) {
              Write-Error "Required updater asset is missing: $assetName"
              exit 1
            }
          }

          $validationDirectory = Join-Path $env:RUNNER_TEMP "nestra-updater-validation"
          New-Item -ItemType Directory -Path $validationDirectory -Force | Out-Null
          gh release download "$env:RELEASE_TAG" --pattern "latest.json" --dir $validationDirectory --clobber
          node ./apps/desktop/scripts/validate-updater-manifest.mjs `
            --manifest (Join-Path $validationDirectory "latest.json") `
            --tag "$env:RELEASE_TAG" `
            --repository "${{ github.repository }}"
