name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    name: Prepare release PR
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Read the updated Release Please pull request
        id: release-pr
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          if [ -z "${RELEASE_PR_JSON}" ] || [ "${RELEASE_PR_JSON}" = "null" ]; then
            echo "Release Please reported an updated pull request without pull request metadata."
            exit 1
          fi

          release_pr_number="$(jq -er '.number' <<< "${RELEASE_PR_JSON}")"
          release_pr_branch="$(jq -er '.headBranchName' <<< "${RELEASE_PR_JSON}")"
          release_pr_base="$(jq -er '.baseBranchName' <<< "${RELEASE_PR_JSON}")"

          if [ "${release_pr_base}" != "${{ github.ref_name }}" ]; then
            echo "Release Please returned a pull request for ${release_pr_base}, expected ${{ github.ref_name }}."
            exit 1
          fi

          live_release_pr_json="$(gh pr view "${release_pr_number}" \
            --repo "${{ github.repository }}" \
            --json baseRefName,headRefName,labels,state)"

          if ! jq -e \
            --arg base "${release_pr_base}" \
            --arg branch "${release_pr_branch}" \
            '.state == "OPEN" and
             .baseRefName == $base and
             .headRefName == $branch and
             ([.labels[].name] | index("autorelease: pending") != null)' \
            <<< "${live_release_pr_json}" > /dev/null; then
            echo "Release Please pull request metadata no longer matches the open pending pull request."
            exit 1
          fi

          echo "found=true" >> "${GITHUB_OUTPUT}"
          echo "branch=${release_pr_branch}" >> "${GITHUB_OUTPUT}"

      - name: Check out the Release Please pull request
        if: ${{ steps.release-pr.outputs.found == 'true' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ steps.release-pr.outputs.branch }}

      - name: Set up pnpm
        if: ${{ steps.release-pr.outputs.found == 'true' }}
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.13.1

      - name: Set up Node.js
        if: ${{ steps.release-pr.outputs.found == 'true' }}
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install formatting dependencies
        if: ${{ steps.release-pr.outputs.found == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Validate and format the Release Please pull request
        if: ${{ steps.release-pr.outputs.found == 'true' }}
        id: format-release-pr
        env:
          RELEASE_PR_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" HEAD; then
            echo "Release Please pull request does not contain the triggering ${GITHUB_SHA} commit."
            exit 1
          fi

          base_version="$(git show "${GITHUB_SHA}:package.json" | jq -er '.version')"
          release_version="$(jq -er '.version' package.json)"
          highest_version="$(printf '%s\n%s\n' "${base_version}" "${release_version}" | sort -V | tail -n 1)"

          if [ "${release_version}" = "${base_version}" ] || [ "${highest_version}" != "${release_version}" ]; then
            echo "Release version ${release_version} must be greater than base version ${base_version}."
            exit 1
          fi

          pnpm exec prettier CHANGELOG.md --write
          pnpm check:product-version

          if ! git diff --quiet -- CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -m "chore: format generated changelog"
          fi

          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${RELEASE_PR_BRANCH}")" ]; then
            echo "updated=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git push origin "HEAD:${RELEASE_PR_BRANCH}"
          echo "updated=true" >> "${GITHUB_OUTPUT}"

      - name: Start checks for the updated Release Please pull request
        if: ${{ steps.format-release-pr.outputs.updated == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          release_pr_sha="$(git rev-parse HEAD)"
          checks_approved=false

          for attempt in {1..10}; do
            mapfile -t pending_run_ids < <(gh api \
              --method GET \
              "repos/${{ github.repository }}/actions/runs" \
              -f head_sha="${release_pr_sha}" \
              -f event="pull_request" \
              -f status="action_required" \
              -f per_page=10 \
              --jq '.workflow_runs[] | select(.name == "CI") | .id')

            if [ "${#pending_run_ids[@]}" -gt 0 ]; then
              checks_approved=true

              for run_id in "${pending_run_ids[@]}"; do
                if ! gh api \
                  --method POST \
                  "repos/${{ github.repository }}/actions/runs/${run_id}/approve"; then
                  checks_approved=false
                fi
              done

              break
            fi

            sleep 2
          done

          if [ "${checks_approved}" = false ]; then
            echo "Bot-triggered pull request checks could not be approved; dispatching CI directly."
            gh workflow run ci.yml --repo "${{ github.repository }}" --ref "${RELEASE_PR_BRANCH}"
          fi

      - name: Dispatch Windows installer attachment
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ -z "${RELEASE_TAG}" ] || [ -z "${RELEASE_SHA}" ]; then
            echo "Release Please reported release_created without tag_name or sha."
            exit 1
          fi

          gh workflow run desktop-release-assets.yml \
            --repo "${{ github.repository }}" \
            -f "tag_name=${RELEASE_TAG}" \
            -f "release_sha=${RELEASE_SHA}"
